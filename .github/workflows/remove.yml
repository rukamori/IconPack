name: Remove icon pack

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Exact filename under svg/, with or without .svg'
        required: true
        type: string

concurrency:
  group: icon-pack-remove-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remove:
    name: Remove selected icon and generated files
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Require branch and PAT
        env:
          ICON_PACK_PAT: ${{ secrets.ICON_PACK_PAT }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "branch" ]; then
            echo "::error::Icon removals must run against a branch."
            exit 1
          fi
          if [ -z "$ICON_PACK_PAT" ]; then
            echo "::error::Repository secret ICON_PACK_PAT is required."
            exit 1
          fi

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Remove icon pack
        env:
          ICON_NAME: ${{ inputs.name }}
        run: python3 .github/scripts/remove_icon_pack.py --name "$ICON_NAME"

      - name: Commit removed icon pack
        env:
          ICON_PACK_PAT: ${{ secrets.ICON_PACK_PAT }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          pat_user_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ICON_PACK_PAT}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user)"
          pat_login="$(printf '%s' "$pat_user_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["login"])')"
          pat_id="$(printf '%s' "$pat_user_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"

          git config user.name "$pat_login"
          git config user.email "${pat_id}+${pat_login}@users.noreply.github.com"
          git add -u
          git commit -m "chore(icon-pack): remove icon and generated files"
          git remote set-url origin "https://x-access-token:${ICON_PACK_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${TARGET_BRANCH}"
